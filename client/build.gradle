plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = '2.2.2'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach { options.release = 25 }

base {
    archivesName = 'zstdnet-proxy-client-fabric-26.3'
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation "net.fabricmc:fabric-loader:${providers.gradleProperty('fabric_loader_version').getOrElse('0.20.1')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${providers.gradleProperty('fabric_api_version').getOrElse('0.165.0+26.3')}"

    implementation project(':common')
    include project(':common')
    implementation 'com.github.luben:zstd-jni:1.5.7-7'
    include 'com.github.luben:zstd-jni:1.5.7-7'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    runs {
        client {
            client()
            runDir 'run'
        }
    }
}

// A separate development mod verifies Knot/Mixin and the real Minecraft/Netty pipeline.
// Its classes/resources are never included in the production jar.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    viaCompatibility {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

configurations {
    viaCompatibilityImplementation.extendsFrom testImplementation
    viaCompatibilityRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    // Optional test fixture extracted from the checksum-pinned official ViaFabricPlus release.
    // Never included in the client jar or the normal build/test runtime.
    viaCompatibilityImplementation files(rootProject.file('runtime/viaversion-common-vfp-5.1.1.jar'))
}

tasks.register('testViaCompatibility', Test) {
    dependsOn tasks.named('viaCompatibilityClasses')
    testClassesDirs = sourceSets.viaCompatibility.output.classesDirs
    classpath = sourceSets.viaCompatibility.runtimeClasspath
}

tasks.register('smokeJar', Jar) {
    dependsOn tasks.named('smokeClasses')
    destinationDirectory = layout.buildDirectory.dir('smoke')
    archiveClassifier = 'smoke-test'
    from sourceSets.smoke.output
}

loom.runs {
    smoke {
        client()
        name 'ZstdNet headless transport smoke test'
        runDir 'build/smoke-run'
        vmArg '-Djava.awt.headless=true'
        vmArg "-Dfabric.addMods=${tasks.named('smokeJar', Jar).get().archiveFile.get().asFile.absolutePath}"
    }
}

tasks.named('runSmoke') {
    dependsOn tasks.named('smokeJar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE_zstdnet_proxy' }
    }
}
